# Development stack with hot reload:
#   docker compose -f docker-compose.dev.yml up -d db mailpit     # just infra (run api/web on host)
#   docker compose -f docker-compose.dev.yml up --build           # everything in containers
#   web http://localhost:5173 | api http://localhost:8000 | mailpit http://localhost:8025 | db localhost:5433
name: turfslot-dev

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: turfslot
      POSTGRES_PASSWORD: turfslot
      POSTGRES_DB: turfslot
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U turfslot -d turfslot"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

  api:
    build:
      context: ./backend
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://turfslot:turfslot@db:5432/turfslot
      TEST_DATABASE_URL: postgresql://turfslot:turfslot@db:5432/turfslot_test
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      FRONTEND_URL: http://localhost:5173
      WATCHFILES_FORCE_POLLING: "true"
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload", "--reload-dir", "app"]
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
    ports:
      - "8000:8000"

  web:
    image: node:22-alpine
    working_dir: /app
    command: ["sh", "-c", "npm install && npm run dev -- --host 0.0.0.0 --port 5173"]
    environment:
      VITE_API_URL: http://localhost:8000
      VITE_MAX_SLOTS_PER_BOOKING: "4"
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - api
    ports:
      - "5173:5173"

volumes:
  postgres_dev_data:
