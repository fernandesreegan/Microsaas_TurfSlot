name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (ruff, alembic, pytest)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: turfslot
          POSTGRES_PASSWORD: turfslot
          POSTGRES_DB: turfslot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U turfslot -d turfslot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://turfslot:turfslot@localhost:5432/turfslot
      TEST_DATABASE_URL: postgresql://turfslot:turfslot@localhost:5432/turfslot_test
      SECRET_KEY: ci-test-secret-key-not-for-production
      SCHEDULER_ENABLED: "false"
      RATE_LIMIT_ENABLED: "false"
      DODO_PAYMENTS_API_KEY: fake
      DODO_PAYMENTS_WEBHOOK_SECRET: whsec_dGVzdC1zZWNyZXQtZm9yLWNpLW9ubHk=
      SMTP_HOST: localhost
      SMTP_PORT: "1025"
      FRONTEND_URL: http://localhost:5173
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Ruff
        run: ruff check .

      - name: Create test database
        env:
          PGPASSWORD: turfslot
        run: psql -h localhost -U turfslot -d turfslot -c "CREATE DATABASE turfslot_test"

      - name: Alembic migrations
        run: alembic upgrade head

      - name: Pytest with coverage
        run: pytest --cov=app --cov-report=term-missing --cov-fail-under=80

  frontend:
    name: Frontend (lint, type-check, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      VITE_API_URL: http://localhost:8000
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run type-check
      - run: npm test  # CI=true keeps vitest out of watch mode
      - run: npm run build

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build images
        run: docker compose build
